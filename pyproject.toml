[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsptools"
version = "0.1.0"
description = "Shared DSP and fixed-point helpers for the advanced digital design course"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["shared"]
